apiVersion: v1
kind: Service

metadata:
  name: payment-platform
  namespace: payment-platform

  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/actuator/prometheus"
    prometheus.io/port: "8080"

spec:
  selector:
    app: payment-platform

  ports:
    - port: 80
      targetPort: 8080
