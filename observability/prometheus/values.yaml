server:
  enabled: true

  persistentVolume:
    enabled: true
    size: 20Gi
    storageClass: gp2

  retention: 15d

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

serverFiles:
  prometheus.yml:
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090

      - job_name: kubernetes-services

        kubernetes_sd_configs:
          - role: endpoints

        relabel_configs:

          - source_labels:
              - __meta_kubernetes_service_annotation_prometheus_io_scrape
            action: keep
            regex: "true"

          - source_labels:
              - __meta_kubernetes_namespace
            action: keep
            regex: payment-platform

          - source_labels:
              - __meta_kubernetes_service_name
            action: keep
            regex: payment-platform

          - source_labels:
              - __meta_kubernetes_service_annotation_prometheus_io_path
            action: replace
            target_label: __metrics_path__

          - source_labels:
              - __address__
              - __meta_kubernetes_service_annotation_prometheus_io_port
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__

alertmanager:
  enabled: true

  persistence:
    enabled: true
    size: 5Gi
    storageClass: gp2

pushgateway:
  enabled: false

kubeStateMetrics:
  enabled: true

prometheus-node-exporter:
  enabled: true