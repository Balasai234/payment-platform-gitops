server:
  enabled: true

  persistentVolume:
    enabled: true
    size: 20Gi
    storageClass: gp2

  retention: 15d

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

alertmanager:
  enabled: true

  persistentVolume:
    enabled: true
    size: 5Gi
    storageClass: gp2

pushgateway:
  enabled: false

kubeStateMetrics:
  enabled: true

prometheus-node-exporter:
  enabled: true