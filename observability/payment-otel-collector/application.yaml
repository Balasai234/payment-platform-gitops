apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd

spec:
  project: default

  sources:
    # Source 1 - Official OpenTelemetry Helm chart
    - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: opentelemetry-collector
      targetRevision: 0.129.0
      helm:
        valueFiles:
          - $values/observability/otel-collector/values.yaml

    # Source 2 - Our GitOps repository
    - repoURL: https://github.com/Balasai234/payment-platform-gitops.git
      targetRevision: main
      path:
      ref: values

  destination:
    server: https://kubernetes.default.svc 
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true