apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: tempo
  namespace: argocd

spec:
  project: default

  sources:
    # Official Grafana Tempo Helm Chart
    - repoURL: https://grafana.github.io/helm-charts
      chart: tempo
      targetRevision: 1.23.3
      helm:
        valueFiles:
          - $values/observability/tempo/values.yaml

    # GitOps Repository containing our values.yaml
    - repoURL: https://github.com/Balasai234/payment-platform-gitops.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true