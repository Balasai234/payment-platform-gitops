# Minimal Loki configuration for the lab cluster
# Loki only — no Promtail, canary, caches, or bundled Grafana.

deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

singleBinary:
  replicas: 1

  persistence:
    enabled: false

# Disable distributed-mode components
backend:
  replicas: 0

read:
  replicas: 0

write:
  replicas: 0

# Disable components we don't need
gateway:
  enabled: false

lokiCanary:
  enabled: false

chunksCache:
  enabled: false

resultsCache:
  enabled: false

test:
  enabled: false